<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Lab ITPLN - Pendaftaran</title>
    <link rel="stylesheet" href="style1.css">
</head>
<body>
    <header>
        <h1>Open Recruitment Asisten</h1>
        <nav>
            <ul>
                <li><a href="inventaris.html">Inventaris</a></li>
                <li><a href="stok.html">Stok Barang</a></li>
                <li><a href="pendaftaran.html" class="active">Pendaftaran</a></li>
                <li><a href="akun.html">Portal Akun</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <div class="card-container">
            <form id="registrationForm" class="reg-form">
                <fieldset>
                    <legend>Data Identitas Calon Asisten</legend>
                    <div class="form-group">
                        <label>Nama Lengkap:</label>
                        <input type="text" placeholder="Sesuai KTM" required>
                    </div>
                    <div class="form-group">
                        <label>Minat Laboratorium:</label>
                        <select>
                            <option>Information Retrieval</option>
                            <option>Software Engineering</option>
                            <option>Intelligent Computing</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Visi & Misi:</label>
                        <textarea rows="5" placeholder="Tuliskan alasan kamu bergabung..." required></textarea>
                    </div>
                    <button type="submit">Kirim Aplikasi</button>
                    <div id="responseMessage"></div>
                </fieldset>
            </form>
        </div>
    </main>
    <footer>202432094_Bona Purba</footer>
    <script>
        document.getElementById('registrationForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const msg = document.getElementById('responseMessage');
            msg.innerHTML = "<span>Pesan sudah terkirim dan akan segera ditindaklanjuti. Terima kasih!</span>";
            this.reset();
        });
    </script>
</body>
</html>
